services:
  api:
    build: .
    restart: always
    environment:
      # Shared PostgreSQL (central instance) — required, no local db service.
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      # Only trust forwarded client IP headers from configured proxy addresses.
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_IPS: "${TRUSTED_PROXY_IPS:-127.0.0.1,::1}"
    ports:
      # Keep the API reachable by a local proxy/tunnel, not directly from the internet.
      - "127.0.0.1:8000:8000"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

# Usage (production):
#   DATABASE_URL=postgresql://<user>:<pass>@<host>:5432/industrial_erp \
#   SECRET_KEY=<random-32-bytes> \
#   docker compose -f docker-compose.prod.yml up --build -d
